<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robux Clicker</title>
<link rel="icon" type="image/png" href="images et musiques/LogoMinisitedejeu.png">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(-45deg,#0f172a,#1e293b,#312e81,#0f172a);
background-size:400% 400%;
animation:bg 12s infinite ease;
color:white;
text-align:center;
overflow-x:hidden;
}

@keyframes bg{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

h1{margin-top:15px;}

#moneyContainer{
font-size:3rem;
font-weight:bold;
margin-top:10px;
display:flex;
justify-content:center;
align-items:center;
gap:10px;
}

#level{margin-bottom:20px;}

#mainImage{
width:260px;
cursor:pointer;
transition:.1s;
filter:drop-shadow(0 0 25px gold);
}

#mainImage:hover{transform:scale(1.05);}
#mainImage:active{transform:scale(.9);}

.shop{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
width:95%;
max-width:1200px;
margin:30px auto;
}

.card{
background:#1e293b;
padding:15px;
border-radius:15px;
}

.card p{margin:6px 0;}

.desc{
color:#cbd5e1;
font-size:.9rem;
min-height:45px;
}

button{
padding:10px 15px;
border:none;
background:#22c55e;
color:white;
border-radius:10px;
cursor:pointer;
margin-top:10px;
}

button:hover{background:#16a34a;}

.particle{
position:absolute;
width:30px;
height:30px;
pointer-events:none;
animation:explode 800ms forwards;
}

@keyframes explode{
to{
transform:translate(var(--x),var(--y)) rotate(720deg) scale(0);
opacity:0;
}
}

.floating{
position:absolute;
font-weight:bold;
color:white;
pointer-events:none;
animation:float 1s forwards;
}

@keyframes float{
to{
transform:translateY(-100px);
opacity:0;
}
}

#menuBtn {
position:absolute;
top:10px;
left:10px;
padding:8px 15px;
border-radius:8px;
border:none;
background:linear-gradient(to right,#ff9800,#ffb74d);
color:white;
cursor:pointer;
}
</style>
</head>

<body>

<h1>ROBUX CLICKER</h1>

<div id="moneyContainer">
  <img src="images et musiques/robux.png" style="width:40px;">
  <span id="money">0</span>
</div>

<div id="level">Niveau 1</div>

<button id="menuBtn" onclick="goToMenu()">🏠 Menu</button>

<img id="mainImage" src="images et musiques/robux.png">

<div class="shop" id="shop"></div>

<script>

let money = 0;
let clickPower = 1;

const upgrades = [
{
name:"🖱️ Clickeur x2",
desc:"Améliore tes clics progressivement.",
gain:1,
cost:50,
owned:0
},
{
name:"🤖 Auto Clicker",
desc:"Production automatique lente.",
gain:1,
cost:200,
owned:0
},
{
name:"⚡ Super Clicker",
desc:"Production améliorée.",
gain:5,
cost:1000,
owned:0
},
{
name:"🏭 Usine",
desc:"Production industrielle.",
gain:20,
cost:5000,
owned:0
},
{
name:"🖥️ Serveur",
desc:"Production avancée.",
gain:80,
cost:25000,
owned:0
},
{
name:"🌐 Datacenter",
desc:"Production massive.",
gain:400,
cost:150000,
owned:0
}
];

const shop = document.getElementById("shop");

function getClickMultiplier(){
return 1 + upgrades[0].owned;
}

function buildShop(){

shop.innerHTML="";

upgrades.forEach((u,index)=>{

let card=document.createElement("div");
card.className="card";

card.innerHTML=`
<h2>${u.name}</h2>
<p class="desc">${u.desc}</p>
<p>Possédés : ${u.owned}</p>

<p>
<img src="images et musiques/robux.png" style="width:18px;vertical-align:middle;">
${Math.floor(u.cost).toLocaleString()}
</p>

<p>
Production :
<img src="images et musiques/robux.png" style="width:14px;vertical-align:middle;">
+${u.gain.toLocaleString()}/s
</p>

<button onclick="buy(${index})">Acheter</button>
`;

shop.appendChild(card);

});

}

function buy(i){

let u = upgrades[i];

if(money >= u.cost){

money -= u.cost;
u.owned++;
u.cost *= 1.5;

update();

}else{

const manque = Math.ceil(u.cost - money);

const box = document.createElement("div");
box.style.position="fixed";
box.style.top="20px";
box.style.left="50%";
box.style.transform="translateX(-50%)";
box.style.background="#ef4444";
box.style.color="white";
box.style.padding="12px 20px";
box.style.borderRadius="12px";
box.style.fontWeight="bold";
box.style.zIndex="9999";

box.innerHTML = `
<img src="images et musiques/robux.png" style="width:18px;vertical-align:middle;">
❌ Il te manque ${manque.toLocaleString()}
`;

document.body.appendChild(box);

setTimeout(()=>box.remove(),2000);

}

}

function update(){

document.getElementById("money").textContent =
Math.floor(money).toLocaleString();

let level = Math.floor(Math.sqrt(money/150))+1;
document.getElementById("level").textContent =
"Niveau "+level;

buildShop();
save();
}

function createRobuxExplosion(x,y){

for(let i=0;i<25;i++){

let img=document.createElement("img");
img.src="images et musiques/robux.png";
img.className="particle";

img.style.left=x+"px";
img.style.top=y+"px";

let angle=Math.random()*Math.PI*2;
let dist=50+Math.random()*180;

img.style.setProperty("--x",Math.cos(angle)*dist+"px");
img.style.setProperty("--y",Math.sin(angle)*dist+"px");

document.body.appendChild(img);

setTimeout(()=>img.remove(),800);

}

}

document.getElementById("mainImage")
.addEventListener("click",(e)=>{

let gain = clickPower * getClickMultiplier();

money += gain;

createRobuxExplosion(e.pageX,e.pageY);

let txt=document.createElement("div");
txt.className="floating";

txt.innerHTML = `
<img src="images et musiques/robux.png" style="width:16px;">
+${gain}
`;

txt.style.left=e.pageX+"px";
txt.style.top=e.pageY+"px";

document.body.appendChild(txt);

setTimeout(()=>txt.remove(),1000);

update();

});

// ===== CHEAT : CTRL + ALT + P + SURVOL DE 🏭 USINE =====

let ctrlPressed = false;
let altPressed = false;
let pPressed = false;
let cheatCooldown = false;

document.addEventListener("keydown", (e) => {
    if (e.key === "Control") ctrlPressed = true;
    if (e.key === "Alt") altPressed = true;
    if (e.key.toLowerCase() === "p") pPressed = true;
});

document.addEventListener("keyup", (e) => {
    if (e.key === "Control") ctrlPressed = false;
    if (e.key === "Alt") altPressed = false;
    if (e.key.toLowerCase() === "p") pPressed = false;
});

document.addEventListener("mouseover", (e) => {

    const title = e.target;

    if (
        title.tagName === "H2" &&
        title.textContent.includes("🏭 Usine") &&
        ctrlPressed &&
        altPressed &&
        pPressed &&
        !cheatCooldown
    ) {

        cheatCooldown = true;

        money += 100000;
        update();

        const txt = document.createElement("div");
        txt.className = "floating";
        txt.innerHTML = `
            <img src="images et musiques/robux.png" style="width:16px;">
            +100000
        `;

        txt.style.left = e.pageX + "px";
        txt.style.top = e.pageY + "px";

        document.body.appendChild(txt);

        setTimeout(() => txt.remove(), 1500);

        // autorise une nouvelle utilisation après 1 seconde
        setTimeout(() => {
            cheatCooldown = false;
        }, 1000);
    }
});


// ⏱️ auto income
setInterval(()=>{

let income = 0;

upgrades.forEach(u=>{
if(u.name !== "🖱️ Clickeur x2"){
income += u.gain * u.owned;
}
});

money += income;

update();

},1000);

// 💾 save
function save(){
localStorage.setItem("clickerSave",JSON.stringify({
money,
upgrades
}));
}

function goToMenu(){
window.location.href = "index.html";
}

function load(){

let data = localStorage.getItem("clickerSave");

if(data){
let obj = JSON.parse(data);

money = obj.money || 0;

if(obj.upgrades){
for(let i=0;i<upgrades.length;i++){
if(obj.upgrades[i]){
upgrades[i] = obj.upgrades[i];
}
}
}
}

update();
}

load();
setInterval(save,5000);

</script>

</body>
</html>
