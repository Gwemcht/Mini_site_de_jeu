<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Draw a Perfect Circle</title>

<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%}
body{background:radial-gradient(circle at center,#202938,#0f172a);color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column;align-items:center;overflow:hidden}
h1{margin:22px 0 4px;font-size:30px;font-weight:800}
#subtitle{color:#9ca3af;margin-bottom:15px;font-size:15px}

#game{position:relative;width:min(92vw,650px);height:min(72vh,650px);background:#17202f;border:2px solid #374151;border-radius:22px;overflow:hidden;touch-action:none;cursor:crosshair;box-shadow:0 25px 70px rgba(0,0,0,.45)}
canvas{display:block;width:100%;height:100%}

#accuracy{position:absolute;top:15px;left:50%;transform:translateX(-50%);padding:7px 15px;border-radius:30px;background:rgba(15,23,42,.78);border:1px solid rgba(255,255,255,.08);color:#d1d5db;font-size:14px;pointer-events:none;transition:color .1s}

#result{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(10,15,25,.95);backdrop-filter:blur(8px)}
#resultTitle{font-size:30px;margin-bottom:5px}
#score{font-size:82px;font-weight:900;line-height:1;margin:5px 0 12px}
#message{color:#d1d5db;font-size:18px;margin-bottom:28px}

button{border:0;padding:14px 30px;border-radius:12px;background:#3b82f6;color:#fff;font-size:17px;font-weight:bold;cursor:pointer;transition:.15s}
button:hover{background:#2563eb;transform:scale(1.04)}
button:active{transform:scale(.98)}

#status{margin-top:13px;min-height:20px;color:#9ca3af;font-size:14px}
</style>
</head>

<body>

<h1>⭕ Draw a Perfect Circle</h1>
<div id="subtitle">Choisis toi-même la taille de ton cercle</div>

<div id="game">
    <canvas id="canvas"></canvas>
    <div id="accuracy">Prêt</div>

    <div id="result">
        <div id="resultTitle">Résultat</div>
        <div id="score">0%</div>
        <div id="message">-</div>
        <button id="restart">Rejouer</button>
    </div>
</div>

<div id="status">Commence à dessiner...</div>

<script>
const $=id=>document.getElementById(id),
game=$("game"),canvas=$("canvas"),ctx=canvas.getContext("2d"),
accuracyElement=$("accuracy"),statusElement=$("status"),result=$("result"),
scoreElement=$("score"),messageElement=$("message"),restartButton=$("restart");

let drawing=false,points=[],accuracySamples=[],width=0,height=0,
centerX=0,centerY=0,playerRadius=0,previousAngle=null,totalAngle=0;

const GREEN=85,YELLOW=60,ORANGE=40;

function resizeCanvas(){
    const r=game.getBoundingClientRect(),dpr=devicePixelRatio||1;
    width=r.width;height=r.height;
    canvas.width=width*dpr;canvas.height=height*dpr;
    canvas.style.width=width+"px";canvas.style.height=height+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    centerX=width/2;centerY=height/2;
    drawBackground();drawCenterPoint();
}

function drawBackground(){ctx.clearRect(0,0,width,height)}

function drawCenterPoint(){
    ctx.save();
    ctx.beginPath();ctx.arc(centerX,centerY,9,0,Math.PI*2);
    ctx.fillStyle="rgba(59,130,246,.12)";ctx.fill();
    ctx.beginPath();ctx.arc(centerX,centerY,4,0,Math.PI*2);
    ctx.fillStyle="#60a5fa";ctx.fill();ctx.restore();
}

function getPosition(e){
    const r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;
    return{x:p.clientX-r.left,y:p.clientY-r.top};
}

function getRadius(p){return Math.hypot(p.x-centerX,p.y-centerY)}

function getAccuracy(p){
    return Math.max(0,Math.min(100,100-Math.abs(getRadius(p)-playerRadius)/playerRadius*100));
}

function getColor(a){
    return a>=GREEN?"#22c55e":a>=YELLOW?"#eab308":a>=ORANGE?"#f97316":"#ef4444";
}

function updateAccuracy(a){
    accuracyElement.textContent=`Précision : ${Math.round(a)}%`;
    accuracyElement.style.color=getColor(a);
    statusElement.textContent=
        a>=GREEN?"🟢 Parfait !":
        a>=YELLOW?"🟡 Très proche...":
        a>=ORANGE?"🟠 Tu t'éloignes...":"🔴 Attention !";
}

function startDrawing(e){
    e.preventDefault();
    if(result.style.display==="flex")return;

    const p=getPosition(e),radius=getRadius(p);

    if(radius<30){
        statusElement.textContent="Commence plus loin du point central.";
        return;
    }

    drawing=true;points=[];accuracySamples=[];totalAngle=0;previousAngle=null;
    playerRadius=radius;
    points.push(p);accuracySamples.push(100);

    previousAngle=Math.atan2(p.y-centerY,p.x-centerX);

    drawBackground();drawCenterPoint();

    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);
    ctx.fillStyle="#22c55e";ctx.fill();

    updateAccuracy(100);
    statusElement.textContent="🟢 Garde la même distance du point !";
}

function draw(e){
    if(!drawing)return;
    e.preventDefault();

    const p=getPosition(e),previous=points.at(-1);
    if(!previous)return;

    const movement=Math.hypot(p.x-previous.x,p.y-previous.y);
    if(movement<2)return;

    points.push(p);

    const accuracy=getAccuracy(p);
    accuracySamples.push(accuracy);

    const angle=Math.atan2(p.y-centerY,p.x-centerX);

    if(previousAngle!==null){
        let difference=angle-previousAngle;
        if(difference>Math.PI)difference-=Math.PI*2;
        if(difference<-Math.PI)difference+=Math.PI*2;
        if(Math.abs(difference)<1)totalAngle+=difference;
    }

    previousAngle=angle;

    ctx.beginPath();
    ctx.moveTo(previous.x,previous.y);
    ctx.lineTo(p.x,p.y);
    ctx.strokeStyle=getColor(accuracy);
    ctx.lineWidth=5;
    ctx.lineCap="round";
    ctx.lineJoin="round";
    ctx.stroke();

    updateAccuracy(accuracy);
}

function stopDrawing(){
    if(!drawing)return;
    drawing=false;

    if(points.length<40){
        statusElement.textContent="Dessine un cercle plus complet.";
        return;
    }

    const rotations=Math.abs(totalAngle)/(Math.PI*2);

    if(rotations<.80){
        statusElement.textContent="Continue jusqu'à faire presque un tour complet.";
        return;
    }

    calculateScore();
}

function calculateScore(){
    let score=accuracySamples.reduce((a,b)=>a+b,0)/accuracySamples.length;
    const rotations=Math.abs(totalAngle)/(Math.PI*2);

    if(rotations<.95)score-=(.95-rotations)*10;

    score=Math.max(0,Math.min(100,score));
    score=Math.round(score*100)/100;

    showResult(score);
}

function showResult(score){
    scoreElement.textContent=score.toFixed(2)+"%";

    let color,message;

    if(score>=GREEN){
        color="#22c55e";
        message=score>=98?"PERFECT ! 🎯":"Excellent cercle ! 🔥";
    }else if(score>=YELLOW){
        color="#eab308";message="Très bien !";
    }else if(score>=ORANGE){
        color="#f97316";message="Pas mal !";
    }else{
        color="#ef4444";
        message="Essaie de garder une distance plus régulière.";
    }

    scoreElement.style.color=color;
    messageElement.textContent=message;
    result.style.display="flex";
    accuracyElement.textContent="Terminé";
    statusElement.textContent="Cercle terminé !";
}

function restart(){
    result.style.display="none";
    drawing=false;
    points=[];accuracySamples=[];playerRadius=0;
    totalAngle=0;previousAngle=null;
    drawBackground();drawCenterPoint();
    accuracyElement.textContent="Prêt";
    accuracyElement.style.color="#d1d5db";
    statusElement.textContent="Commence à dessiner...";
}

restartButton.addEventListener("click",restart);

canvas.addEventListener("mousedown",startDrawing);
canvas.addEventListener("mousemove",draw);
window.addEventListener("mouseup",stopDrawing);

canvas.addEventListener("touchstart",startDrawing,{passive:false});
canvas.addEventListener("touchmove",draw,{passive:false});
canvas.addEventListener("touchend",stopDrawing,{passive:false});

window.addEventListener("resize",resizeCanvas);

resizeCanvas();
drawBackground();
drawCenterPoint();
</script>

</body>
</html>
